version: "3.9"

services:
  baseline-backend:
    build:
      context: ./GlossaryKEKACHY/backend
    container_name: baseline-backend
    restart: unless-stopped
    networks:
      - baseline-network
    ports:
      - "8000:8000"

  baseline-frontend:
    build:
      context: ./GlossaryKEKACHY/frontend
    container_name: baseline-frontend
    restart: unless-stopped
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
    depends_on:
      - baseline-backend
    networks:
      - baseline-network
    ports:
      - "8080:8080"

  baseline-nginx:
    image: nginx:latest
    container_name: baseline-nginx
    restart: unless-stopped
    depends_on:
      - baseline-backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - baseline-network
    ports:
      - "80:80"

  baseline-prometheus:
    image: prom/prometheus:latest
    container_name: baseline-prometheus
    restart: unless-stopped
    depends_on:
      - baseline-backend
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - baseline-network
    ports:
      - "9090:9090"

networks:
  baseline-network:
    driver: bridge