version: "3.9"

services:
  reactive-deployer:
    image: docker:27-cli
    container_name: reactive-deployer
    privileged: true
    network_mode: host
    working_dir: /workspace
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
    entrypoint: ["/bin/sh", "/workspace/deploy.sh"]
    restart: "no"