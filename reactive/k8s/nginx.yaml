apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactive-nginx
  namespace: reactive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reactive-nginx
  template:
    metadata:
      labels:
        app: reactive-nginx
    spec:
      containers:
        - name: reactive-nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /metrics
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /metrics
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: reactive-nginx-config

---
apiVersion: v1
kind: Service
metadata:
  name: reactive-nginx
  namespace: reactive
spec:
  type: NodePort
  selector:
    app: reactive-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
