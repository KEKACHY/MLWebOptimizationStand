apiVersion: v1
kind: ConfigMap
metadata:
  name: reactive-nginx-config
  namespace: reactive
data:
  nginx.conf: |
    events {}

    http {
        upstream reactive_backend {
            server reactive-backend:8000;
        }

        server {
            listen 80;

            location / {
                proxy_pass http://reactive_backend;
                proxy_http_version 1.1;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
    }