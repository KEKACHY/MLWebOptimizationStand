apiVersion: v1
kind: ConfigMap
metadata:
  name: reactive-prometheus-config
  namespace: reactive
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "reactive-backend"
        static_configs:
          - targets:
              - "reactive-backend:8000"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactive-prometheus
  namespace: reactive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reactive-prometheus
  template:
    metadata:
      labels:
        app: reactive-prometheus
    spec:
      containers:
        - name: reactive-prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=6h"
            - "--storage.tsdb.retention.size=1GB"
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: prometheus-config
          configMap:
            name: reactive-prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: reactive-prometheus
  namespace: reactive
spec:
  type: LoadBalancer
  selector:
    app: reactive-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090