apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactive-backend
  namespace: reactive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reactive-backend
  template:
    metadata:
      labels:
        app: reactive-backend
    spec:
      containers:
        - name: reactive-backend
          image: reactive-backend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "25m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: reactive-backend
  namespace: reactive
spec:
  type: ClusterIP
  selector:
    app: reactive-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: reactive-backend-headless
  namespace: reactive
spec:
  clusterIP: None
  selector:
    app: reactive-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
