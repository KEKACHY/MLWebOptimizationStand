apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactive-frontend
  namespace: reactive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reactive-frontend
  template:
    metadata:
      labels:
        app: reactive-frontend
    spec:
      containers:
        - name: reactive-frontend
          image: reactive-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"

---
apiVersion: v1
kind: Service
metadata:
  name: reactive-frontend
  namespace: reactive
spec:
  type: NodePort
  selector:
    app: reactive-frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081