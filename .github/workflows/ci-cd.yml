name: CI/CD for Stand

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-smoke-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build backend image 
        run: docker build -t web-backend-image ./GlossaryKEKACHY/backend

      - name: Build Compose services
        run: docker compose build

      - name: Start stand with Docker Compose
        run: docker compose up -d

      - name: Show running containers
        run: docker ps -a

      - name: Wait for services
        run: sleep 30

      - name: Check backend through Nginx
        run: curl --fail --retry 10 --retry-delay 3 http://localhost/glossaries/

      - name: Check backend Prometheus metrics endpoint
        run: curl --fail --retry 10 --retry-delay 3 http://localhost/metrics

      - name: Check backend current metrics endpoint
        run: curl --fail --retry 10 --retry-delay 3 http://localhost/current_metrics

      - name: Check frontend
        run: curl --fail --retry 10 --retry-delay 3 http://localhost:8080/

      - name: Check ML prediction service
        run: curl --fail --retry 10 --retry-delay 3 http://localhost:9000/current_prediction

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stand
        if: always()
        run: docker compose down --volumes --remove-orphans
